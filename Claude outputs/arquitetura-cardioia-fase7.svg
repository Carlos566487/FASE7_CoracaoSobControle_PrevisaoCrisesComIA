<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="setaR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="1200" height="640" fill="#ffffff"/>
  <text x="600" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">CardioIA Fase 7 — Arquitetura final (Sensor → MicroPython → Backend Python → IA → UI)</text>

  <!-- Camada 1: Borda -->
  <rect x="30" y="80" width="300" height="400" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="180" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">1 · BORDA (IoT)</text>
  <text x="180" y="128" text-anchor="middle" font-size="12" fill="#166534">Wokwi · ESP32 · MicroPython</text>
  <rect x="50" y="145" width="260" height="120" rx="10" fill="#fff" stroke="#86efac"/>
  <text x="65" y="168" font-size="13" font-weight="700" fill="#0f172a">Sensores</text>
  <text x="65" y="190" font-size="12" fill="#334155">• DHT22 → temperatura / umidade</text>
  <text x="65" y="210" font-size="12" fill="#334155">• Potenciômetro 1 → BPM (40–180)</text>
  <text x="65" y="230" font-size="12" fill="#334155">• Potenciômetro 2 → SpO₂ (70–100 %)</text>
  <text x="65" y="252" font-size="11" fill="#64748b">GPIO4 · GPIO32 · GPIO33</text>
  <rect x="50" y="278" width="260" height="105" rx="10" fill="#fff" stroke="#86efac"/>
  <text x="65" y="300" font-size="13" font-weight="700" fill="#0f172a">main.py + logica.py</text>
  <text x="65" y="321" font-size="12" fill="#334155">• leitura a cada 5 s</text>
  <text x="65" y="340" font-size="12" fill="#334155">• alertas locais (BPM&gt;120, T&gt;38, SpO₂&lt;88)</text>
  <text x="65" y="359" font-size="12" fill="#334155">• fila offline FIFO (20) + envio em lote</text>
  <rect x="50" y="396" width="260" height="70" rx="10" fill="#fff" stroke="#86efac"/>
  <text x="65" y="418" font-size="13" font-weight="700" fill="#0f172a">Feedback visual</text>
  <text x="65" y="438" font-size="12" fill="#334155">• LED verde (envio OK) · LED vermelho</text>
  <text x="65" y="456" font-size="12" fill="#334155">• OLED SSD1306: BPM, SpO₂, risco, Wi-Fi</text>

  <!-- Camada 2: Backend -->
  <rect x="440" y="80" width="330" height="400" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="605" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">2 · BACKEND INTEGRADOR</text>
  <text x="605" y="128" text-anchor="middle" font-size="12" fill="#1e40af">Python 3.11 · FastAPI · Render</text>
  <rect x="460" y="145" width="290" height="140" rx="10" fill="#fff" stroke="#93c5fd"/>
  <text x="475" y="167" font-size="13" font-weight="700" fill="#0f172a">Rotas REST</text>
  <text x="475" y="188" font-size="12" fill="#334155" font-family="Consolas, monospace">POST /api/sensores  (+ /lote)</text>
  <text x="475" y="207" font-size="12" fill="#334155" font-family="Consolas, monospace">GET  /api/leituras  · /ultima</text>
  <text x="475" y="226" font-size="12" fill="#334155" font-family="Consolas, monospace">POST /api/risco     (simulação)</text>
  <text x="475" y="245" font-size="12" fill="#334155" font-family="Consolas, monospace">POST /api/chat</text>
  <text x="475" y="264" font-size="12" fill="#334155" font-family="Consolas, monospace">GET  /health · /docs (Swagger)</text>
  <rect x="460" y="298" width="290" height="170" rx="10" fill="#fff" stroke="#93c5fd"/>
  <text x="475" y="320" font-size="13" font-weight="700" fill="#0f172a">Pipeline de risco (services/risco.py)</text>
  <text x="475" y="342" font-size="12" fill="#334155">① sensor + contexto + padrão → 10 features</text>
  <text x="475" y="362" font-size="12" fill="#334155">② modelo F6 → probabilidade 0–1</text>
  <text x="475" y="382" font-size="12" fill="#334155">③ faixa: baixo &lt;0,30 ≤ moderado &lt;0,50 ≤ alto</text>
  <text x="475" y="402" font-size="12" fill="#334155">④ protocolos clínicos da F6 (10 regras)</text>
  <text x="475" y="422" font-size="12" fill="#334155">⑤ histórico em memória (200 leituras)</text>
  <text x="475" y="447" font-size="11" fill="#64748b">resposta inclui LED, linhas OLED e aviso legal</text>

  <!-- Camada 3: IA -->
  <rect x="880" y="80" width="290" height="185" rx="14" fill="#fdf4ff" stroke="#9333ea" stroke-width="2"/>
  <text x="1025" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#6b21a8">3 · MOTORES DE IA</text>
  <rect x="898" y="122" width="254" height="62" rx="10" fill="#fff" stroke="#d8b4fe"/>
  <text x="912" y="145" font-size="13" font-weight="700" fill="#0f172a">Modelo preditivo F6</text>
  <text x="912" y="166" font-size="12" fill="#334155">RandomForest · scikit-learn 1.6.1</text>
  <rect x="898" y="192" width="254" height="62" rx="10" fill="#fff" stroke="#d8b4fe"/>
  <text x="912" y="215" font-size="13" font-weight="700" fill="#0f172a">Assistente conversacional F5</text>
  <text x="912" y="236" font-size="12" fill="#334155">IBM Watson Assistant v2</text>

  <!-- Camada 4: UI -->
  <rect x="880" y="295" width="290" height="185" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="1025" y="323" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">4 · INTERFACES</text>
  <rect x="898" y="337" width="254" height="62" rx="10" fill="#fff" stroke="#fca5a5"/>
  <text x="912" y="360" font-size="13" font-weight="700" fill="#0f172a">Web · React + Vite</text>
  <text x="912" y="381" font-size="12" fill="#334155">Vercel · polling a cada 5 s</text>
  <rect x="898" y="407" width="254" height="62" rx="10" fill="#fff" stroke="#fca5a5"/>
  <text x="912" y="430" font-size="13" font-weight="700" fill="#0f172a">Mobile · React Native + Expo</text>
  <text x="912" y="451" font-size="12" fill="#334155">APK Android via EAS Build</text>

  <!-- Setas -->
  <line x1="330" y1="205" x2="436" y2="205" stroke="#475569" stroke-width="2.5" marker-end="url(#seta)"/>
  <text x="383" y="185" text-anchor="middle" font-size="11" fill="#475569">POST HTTPS</text>
  <text x="383" y="198" text-anchor="middle" font-size="11" fill="#475569">a cada 5 s</text>
  <line x1="436" y1="420" x2="334" y2="420" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#setaR)"/>
  <text x="385" y="400" text-anchor="middle" font-size="11" fill="#b91c1c">risco, faixa</text>
  <text x="385" y="413" text-anchor="middle" font-size="11" fill="#b91c1c">LED, OLED</text>
  <line x1="770" y1="160" x2="894" y2="160" stroke="#475569" stroke-width="2.5" marker-end="url(#seta)"/>
  <text x="832" y="152" text-anchor="middle" font-size="11" fill="#475569">10 features</text>
  <line x1="770" y1="225" x2="894" y2="225" stroke="#475569" stroke-width="2.5" marker-end="url(#seta)"/>
  <text x="832" y="217" text-anchor="middle" font-size="11" fill="#475569">/api/chat</text>
  <line x1="894" y1="400" x2="774" y2="400" stroke="#475569" stroke-width="2.5" marker-end="url(#seta)"/>
  <text x="832" y="380" text-anchor="middle" font-size="11" fill="#475569">GET /health</text>
  <text x="832" y="393" text-anchor="middle" font-size="11" fill="#475569">/api/leituras</text>
  <line x1="774" y1="440" x2="894" y2="440" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#setaR)"/>
  <text x="832" y="458" text-anchor="middle" font-size="11" fill="#b91c1c">JSON risco</text>

  <!-- Faixa inferior: deploy -->
  <rect x="30" y="510" width="1140" height="105" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="50" y="537" font-size="14" font-weight="700" fill="#0f172a">Deploy e distribuição</text>
  <text x="50" y="562" font-size="12" fill="#334155">GitHub (JV-004/CardioIA-Fase7) — PR #4 integrado à main</text>
  <text x="50" y="584" font-size="12" fill="#334155">Render: Backend/ · auto-deploy on commit · /health</text>
  <text x="470" y="562" font-size="12" fill="#334155">Vercel: Frontend/ · vercel.json (rewrite SPA) · VITE_API_URL</text>
  <text x="470" y="584" font-size="12" fill="#334155">Expo EAS: Mobile/ · perfil preview · APK · SDK 58</text>
  <text x="870" y="562" font-size="12" fill="#334155">Wokwi: projeto público 479256586222505985</text>
  <text x="870" y="584" font-size="12" fill="#334155">Dados simulados · uso acadêmico</text>
</svg>
