<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>CardioIA Fase 7 — Capa</title>
<style>
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#07080d;}
  body{font-family:"Inter","Segoe UI",Arial,sans-serif;color:#fff;}
  #stage{position:relative;width:1920px;height:1080px;overflow:hidden;}
  #bg{position:absolute;inset:0;}
  .abs{position:absolute;}
  #tagL,#tagR{top:64px;font-size:22px;letter-spacing:.24em;text-transform:uppercase;font-weight:600;color:#fca5a5;}
  #tagL{left:96px;} #tagR{right:96px;text-align:right;}
  #rule{top:108px;left:96px;height:2px;width:1728px;background:linear-gradient(90deg,#dc2626,rgba(220,38,38,0));transform-origin:left;}
  #titleRow{left:0;right:0;top:250px;display:flex;justify-content:center;align-items:center;gap:44px;}
  #heart{width:190px;height:190px;filter:drop-shadow(0 0 40px rgba(239,68,68,.75));}
  #title{font-size:212px;font-weight:900;letter-spacing:-.045em;line-height:1;display:flex;}
  #title span{display:inline-block;}
  #title .ia{background:linear-gradient(180deg,#ff6b6b,#dc2626);-webkit-background-clip:text;background-clip:text;color:transparent;}
  #badge{margin-left:28px;align-self:center;padding:14px 26px;border:3px solid #ef4444;border-radius:14px;font-size:40px;font-weight:800;letter-spacing:.08em;color:#fff;background:rgba(220,38,38,.18);}
  #sub{left:0;right:0;top:500px;text-align:center;font-size:44px;font-weight:300;color:#e2e8f0;letter-spacing:.01em;}
  #sub b{font-weight:700;color:#fff;}
  #ecg{left:0;top:575px;width:1920px;height:230px;}
  #flow{left:0;right:0;top:830px;display:flex;justify-content:center;align-items:center;gap:18px;}
  .chip{padding:16px 28px;border-radius:999px;border:2px solid rgba(248,113,113,.55);background:rgba(15,17,26,.85);font-size:28px;font-weight:600;color:#fff;white-space:nowrap;}
  .chip small{display:block;font-size:17px;font-weight:500;color:#fca5a5;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px;}
  .chip.hot{background:linear-gradient(135deg,#b91c1c,#ef4444);border-color:#fecaca;}
  .arrow{font-size:34px;color:#ef4444;font-weight:700;}
  #team{left:0;right:0;bottom:56px;text-align:center;font-size:24px;color:#94a3b8;letter-spacing:.04em;}
  #team b{color:#e2e8f0;font-weight:600;}
  #bpm{right:96px;top:150px;text-align:right;}
  #bpm .v{font-size:76px;font-weight:800;color:#fff;line-height:1;font-variant-numeric:tabular-nums;}
  #bpm .u{font-size:22px;color:#fca5a5;letter-spacing:.2em;font-weight:600;}
  #live{left:96px;top:150px;display:flex;align-items:center;gap:14px;font-size:22px;font-weight:600;letter-spacing:.2em;color:#fca5a5;}
  #dot{width:18px;height:18px;border-radius:50%;background:#ef4444;box-shadow:0 0 18px #ef4444;}
</style></head><body>
<div id="stage">
  <canvas id="bg" width="1920" height="1080"></canvas>
  <div id="tagL" class="abs">FIAP · Inteligência Artificial</div>
  <div id="tagR" class="abs">MVP Final · 2026</div>
  <div id="rule" class="abs"></div>
  <div id="live" class="abs"><div id="dot"></div>MONITORAMENTO AO VIVO</div>
  <div id="bpm" class="abs"><div class="v" id="bpmv">72</div><div class="u">BPM</div></div>

  <div id="titleRow" class="abs">
    <svg id="heart" viewBox="0 0 100 92"><defs><linearGradient id="hg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7a7a"/><stop offset="1" stop-color="#b91c1c"/></linearGradient></defs>
      <path d="M50 90 C 20 66, 2 48, 2 27 C 2 12, 14 2, 28 2 C 38 2, 46 8, 50 16 C 54 8, 62 2, 72 2 C 86 2, 98 12, 98 27 C 98 48, 80 66, 50 90 Z" fill="url(#hg)"/>
      <polyline points="14,44 34,44 40,32 47,58 54,22 60,44 86,44" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>
    <div id="title"></div>
    <div id="badge">FASE 7</div>
  </div>
  <div id="sub" class="abs">Coração Sob Controle: <b>Previsão de Crises com IA</b></div>

  <svg id="ecg" class="abs" viewBox="0 0 1920 230">
    <defs>
      <filter id="glow" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <linearGradient id="fadeEdges" x1="0" x2="1"><stop offset="0" stop-color="#ef4444" stop-opacity="0"/><stop offset=".08" stop-color="#ef4444"/><stop offset=".92" stop-color="#ef4444"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/></linearGradient>
    </defs>
    <path id="ecgBase" fill="none" stroke="rgba(239,68,68,.16)" stroke-width="3"/>
    <path id="ecgLine" fill="none" stroke="url(#fadeEdges)" stroke-width="5" stroke-linejoin="round" filter="url(#glow)"/>
    <path id="ecgSweep" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle id="tip" r="10" fill="#fff" filter="url(#glow)"/>
  </svg>

  <div id="flow" class="abs"></div>
  <div id="team" class="abs"><b>Tayná Esteves</b> · <b>João</b> · <b>Endrew Alves</b> · <b>Carlos Souza</b></div>
</div>
<script>
const W=1920, H=1080;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3);};
const easeBack=x=>{x=clamp(x);const c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
const prog=(t,a,d)=>clamp((t-a)/d);

// título
const word="CardioIA";
const titleEl=document.getElementById('title');
const letters=[...word].map((ch,i)=>{const s=document.createElement('span');s.textContent=ch;if(i>=6)s.className='ia';titleEl.appendChild(s);return s;});

// fluxo
const steps=[["Sensor","ESP32 · Wokwi"],["MicroPython","borda"],["Backend","FastAPI · Render"],["IA","modelo F6 · Watson"],["Web / Mobile","Vercel · APK"]];
const flow=document.getElementById('flow');const chips=[],arrows=[];
steps.forEach((s,i)=>{const c=document.createElement('div');c.className='chip'+(i===3?' hot':'');c.innerHTML=`<small>${s[1]}</small>${s[0]}`;flow.appendChild(c);chips.push(c);
  if(i<steps.length-1){const a=document.createElement('div');a.className='arrow';a.textContent='→';flow.appendChild(a);arrows.push(a);}});

// ECG
const beatW=320, base=150;
function beat(x0){ // P, QRS, T
  return [[x0,base],[x0+40,base],[x0+55,base-14],[x0+70,base],[x0+92,base],[x0+102,base+18],[x0+116,base-128],[x0+130,base+46],[x0+142,base],[x0+180,base],[x0+205,base-26],[x0+230,base],[x0+beatW,base]];
}
let pts=[];for(let x=-40;x<W+beatW;x+=beatW)pts=pts.concat(beat(x));
pts=pts.filter((p,i)=>p[0]<=W+20);
const d="M"+pts.map(p=>p.join(' ')).join(' L');
['ecgBase','ecgLine','ecgSweep'].forEach(id=>document.getElementById(id).setAttribute('d',d));
const line=document.getElementById('ecgLine'), sweep=document.getElementById('ecgSweep'), tip=document.getElementById('tip');
const L=line.getTotalLength();
line.style.strokeDasharray=L; sweep.style.strokeDasharray=`140 ${L}`;
// posições dos picos (R) para sincronizar o coração
const peaksX=[];for(let x=-40;x<W;x+=beatW)peaksX.push(x+116);

// fundo: grade + brilho
const bg=document.getElementById('bg'),g=bg.getContext('2d');
const parts=Array.from({length:70},(_,i)=>({x:(i*397)%W,y:(i*233)%H,r:1+(i%3),s:.15+(i%5)*.06}));
function drawBg(t,pulse){
  g.fillStyle='#07080d';g.fillRect(0,0,W,H);
  const r=g.createRadialGradient(W/2,420,40,W/2,420,1100);
  r.addColorStop(0,`rgba(185,28,28,${.42+.18*pulse})`);r.addColorStop(.45,'rgba(127,29,29,.18)');r.addColorStop(1,'rgba(7,8,13,0)');
  g.fillStyle=r;g.fillRect(0,0,W,H);
  g.strokeStyle='rgba(248,113,113,.06)';g.lineWidth=1;
  const off=(t*30)%60;
  for(let x=-off;x<W;x+=60){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke();}
  for(let y=0;y<H;y+=60){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();}
  parts.forEach(p=>{const y=(p.y-t*60*p.s*3+H*10)%H;g.fillStyle=`rgba(252,165,165,${.15+.25*p.s})`;g.beginPath();g.arc(p.x,y,p.r,0,7);g.fill();});
  // vinheta
  const v=g.createRadialGradient(W/2,H/2,500,W/2,H/2,1150);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.65)');g.fillStyle=v;g.fillRect(0,0,W,H);
}

const $=id=>document.getElementById(id);
function show(el,p,dy=30,scale=false){el.style.opacity=p;el.style.transform=scale?`scale(${.6+.4*p})`:`translateY(${(1-p)*dy}px)`;}

window.render=function(t){
  // ECG desenha de 0.3 a 3.0 s; depois uma varredura branca percorre a linha a cada 2 s
  const draw=ease(prog(t,0.3,2.7));
  line.style.strokeDashoffset=L*(1-draw);
  const tipLen=L*draw; const tp=line.getPointAtLength(Math.min(tipLen,L-1));
  tip.setAttribute('cx',tp.x);tip.setAttribute('cy',tp.y);tip.style.opacity=draw<1?1:0;
  let sweepOn=t>3.0; const sp=((t-3.0)/2.2)%1;
  sweep.style.strokeDashoffset=-(sp*(L+140)-140); sweep.style.opacity=sweepOn?.9:0;

  // batimento: pulso quando a ponta/varredura passa por um pico R
  const headX = t<3.0 ? tp.x : sweep.getPointAtLength(clamp(sp*(L+140),0,L-1)).x;
  let pulse=0; peaksX.forEach(px=>{const dx=headX-px; if(dx>=0&&dx<90) pulse=Math.max(pulse,1-dx/90);});
  drawBg(t,pulse);

  // coração
  const hp=easeBack(prog(t,0.9,0.7));
  $('heart').style.opacity=clamp(prog(t,0.9,0.4));
  $('heart').style.transform=`scale(${hp*(1+.12*pulse)})`;

  // título letra a letra
  letters.forEach((s,i)=>{const p=ease(prog(t,1.3+i*0.07,0.55));s.style.opacity=p;s.style.transform=`translateY(${(1-p)*90}px) rotate(${(1-p)*8}deg)`;});
  const bp=easeBack(prog(t,2.0,0.6)); $('badge').style.opacity=clamp(prog(t,2.0,.3)); $('badge').style.transform=`scale(${bp})`;
  show($('sub'),ease(prog(t,2.4,0.7)),24);

  // topo
  show($('tagL'),ease(prog(t,0.2,0.6)),-16); show($('tagR'),ease(prog(t,0.3,0.6)),-16);
  $('rule').style.transform=`scaleX(${ease(prog(t,0.3,1.2))})`;
  show($('live'),ease(prog(t,3.0,0.5)),-10); show($('bpm'),ease(prog(t,3.1,0.5)),-10);
  $('dot').style.opacity=.35+.65*(0.5+0.5*Math.cos(t*6));
  // BPM sobe de 72 até 145 (crise simulada) e se mantém
  const bv=Math.round(72+73*ease(prog(t,3.6,2.4))); $('bpmv').textContent=bv; $('bpmv').style.color=bv>120?'#f87171':'#fff';

  // fluxo
  chips.forEach((c,i)=>{const p=easeBack(prog(t,3.3+i*0.28,0.5));c.style.opacity=clamp(prog(t,3.3+i*0.28,.3));c.style.transform=`translateY(${(1-p)*40}px) scale(${.85+.15*p})`;
    const lit=t>3.3+i*0.28+0.3 && Math.floor(((t-4.8)/0.35))%5===i && t>4.8; c.style.boxShadow=lit?'0 0 34px rgba(239,68,68,.85)':'none';});
  arrows.forEach((a,i)=>{a.style.opacity=clamp(prog(t,3.45+i*0.28,.3));});
  show($('team'),ease(prog(t,4.8,0.7)),20);
};
window.render(new URLSearchParams(location.search).has('t')?+new URLSearchParams(location.search).get('t'):8);
// modo apresentação: anima em tempo real se aberto com ?play
if(new URLSearchParams(location.search).has('play')){const t0=performance.now();(function loop(){window.render((performance.now()-t0)/1000);requestAnimationFrame(loop);})();}
</script>
</body></html>
